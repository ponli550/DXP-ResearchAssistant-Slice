<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Research Assistant Client Proposal</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400..700&family=Geist:wght@400..700&display=swap">
<style>
  :root {
    --bg: #FAF6EE;
    --panel: #F4ECE0;
    --card: #FFFFFF;
    --fg: #1B1613;
    --dim: #7A7066;
    --line: #ECE3D6;
    --accent: #9E3B33;
    --accent-ink: #FDF0EE;
    --accent-soft: #F3E1DE;
    --accent-soft-ink: #7A2A24;
    --almond: #EED3BA;
    --ok: #3F7A54; --ok-soft: #E3F0E7; --ok-ink: #2C5B3C;
    --warn: #B6791F; --warn-soft: #F6EAD2; --warn-ink: #7C5410;
    --danger: #C0392B;
    --ink: #1B1613; --ink2: #2A2320;
    --serif: "Fraunces", "Iowan Old Style", Georgia, serif;
    --sans: "Geist", "Helvetica Neue", Arial, system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #1B1613; color: var(--fg); overflow: hidden; }
  body { font-family: var(--sans); display: grid; place-items: center; }

  #stage {
    width: 1280px; height: 720px; position: relative; flex: none;
    transform-origin: center center; background: var(--bg); color: var(--fg);
    border: 1px solid var(--line);
  }
  #stage.dark { background: var(--ink); color: var(--bg); }
  #stage.accent { background: var(--accent); color: var(--accent-ink); }
  #stage.panel { background: var(--panel); }

  .hdr {
    position: absolute; top: 22px; left: 56px; right: 56px;
    display: flex; justify-content: space-between;
    font: 500 12px var(--sans); letter-spacing: .18em; text-transform: uppercase; color: var(--dim);
  }
  .hdr b { color: var(--accent); font-weight: 600; }
  #stage.dark .hdr, #stage.accent .hdr { color: var(--almond); }
  #stage.dark .hdr b, #stage.accent .hdr b { color: var(--almond); }

  .slide { position: absolute; inset: 64px 56px 52px 56px; display: grid; gap: 22px; align-content: start; }
  .slide.center { align-content: center; }
  .slide.between { align-content: space-between; }

  h1 { font: 500 72px/1.05 var(--serif); letter-spacing: -.01em; max-width: 1050px; }
  h2 { font: 500 44px/1.1 var(--serif); letter-spacing: -.01em; }
  h3 { font: 600 15px var(--sans); letter-spacing: .16em; text-transform: uppercase; color: var(--accent); }
  h3.ok { color: var(--ok); } h3.warn { color: var(--warn-ink); } h3.danger { color: var(--danger); }
  .kicker { font: 600 14px var(--sans); letter-spacing: .22em; text-transform: uppercase; color: var(--accent); }
  #stage.dark .kicker, #stage.accent .kicker { color: var(--almond); }
  p, li { font-size: 18px; line-height: 1.4; }
  p.big { font-size: 24px; line-height: 1.35; }
  p.dim { color: var(--dim); }
  #stage.dark p.dim { color: var(--almond); }
  ul, ol { padding-left: 22px; display: grid; gap: 8px; }
  ol li::marker { color: var(--accent); font-weight: 600; }

  .cols { display: grid; gap: 20px; align-items: start; }
  .cols.c2 { grid-template-columns: 1fr 1fr; }
  .cols.c3 { grid-template-columns: 1fr 1fr 1fr; }
  .cols.c4 { grid-template-columns: repeat(4, 1fr); }
  .cols.side { grid-template-columns: 1fr 400px; }
  .stack { display: grid; gap: 10px; align-content: start; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 14px 18px; }
  .card p { font-size: 17px; }
  .card.soft { background: var(--accent-soft); border-color: var(--almond); color: var(--accent-soft-ink); }
  .card.ok { background: var(--ok-soft); border-color: var(--ok-soft); color: var(--ok-ink); }
  .card.warn { background: var(--warn-soft); border-color: var(--warn-soft); color: var(--warn-ink); }
  .card.panel { background: var(--panel); border-color: var(--panel); }
  .card.ink { background: var(--ink); border-color: var(--ink); color: var(--bg); }
  .card.ink .lbl, .card.ink h3 { color: var(--almond); }
  .card.ink2 { background: var(--ink2); border-color: var(--ink2); color: var(--bg); }
  .card.ink2 .lbl { color: var(--almond); }
  .card.accent { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .card.accent .lbl { color: var(--accent-ink); }
  .card .lbl { font: 600 14px var(--sans); color: var(--accent); margin-bottom: 6px; }
  .card .lbl.u { letter-spacing: .14em; text-transform: uppercase; font-size: 13px; color: var(--dim); }
  .card .t { font-size: 19px; font-weight: 600; line-height: 1.25; margin-bottom: 4px; }
  .cols.tight .card { padding: 9px 13px; }
  .cols.tight .card p { font-size: 15px; line-height: 1.3; }
  .cols.tight .stack { gap: 7px; }
  .cols.qa .card { padding: 10px 14px; }
  .cols.qa ul { margin-top: 6px; gap: 5px; padding-left: 18px; }
  .cols.qa li { font-size: 15px; line-height: 1.3; }
  .card .num { font: 500 56px/1 var(--serif); margin: 6px 0 10px; }

  .flow { display: flex; align-items: stretch; gap: 8px; }
  .flow .card { flex: 1; }
  .flow .arr { align-self: center; width: 0; height: 0; border-top: 9px solid transparent; border-bottom: 9px solid transparent; border-left: 16px solid var(--almond); flex: none; }

  table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--line); font-size: 16px; }
  th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; line-height: 1.3; }
  th { background: var(--ink); color: var(--bg); font-weight: 600; font-size: 14px; letter-spacing: .04em; }
  tr:nth-child(odd) td { background: var(--bg); }
  td:last-child { white-space: nowrap; }
  table.wrap td:last-child { white-space: normal; }
  td.ok { color: var(--ok); font-weight: 600; } td.warn { color: var(--warn); font-weight: 600; } td.danger { color: var(--danger); font-weight: 600; }
  table.sm { font-size: 15px; } table.sm th, table.sm td { padding: 7px 10px; }

  .names { font-size: 17px; color: var(--almond); }
  .ftr { position: absolute; left: 56px; right: 56px; bottom: 18px; display: flex; justify-content: space-between; font: 500 12px var(--sans); color: var(--dim); letter-spacing: .06em; }
  #stage.dark .ftr, #stage.accent .ftr { color: var(--almond); }
  .prog { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--accent); transition: width .2s; }
  #stage.accent .prog { background: var(--almond); }
  .note { position: absolute; left: 56px; right: 56px; bottom: 44px; display: none; background: var(--ink); color: var(--bg); padding: 12px 16px; border-radius: 8px; font-size: 15px; line-height: 1.4; }
  #stage.notes .note { display: block; }
.b{opacity:0;transform:translateY(6px)}table tr,.card{transition:opacity .25s ease-out,transform .25s ease-out}@media (prefers-reduced-motion:reduce){table tr,.card{transition:none}}
.shot{margin:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;box-shadow:0 10px 36px rgba(27,22,19,.14)}.shot img{display:block;width:100%;height:auto}.shot.h img{height:430px;object-fit:cover;object-position:top}.shot.h2 img{height:350px;object-fit:cover;object-position:top}.shot figcaption{font-size:13px;color:var(--dim);padding:8px 12px;border-top:1px solid var(--line);background:var(--paper,#fff)}
.kv{display:flex;gap:36px;margin:6px 0 14px}.kv div{display:flex;flex-direction:column}.kv b{font:600 40px/1 Fraunces,Georgia,serif;color:var(--ink)}.kv span{font-size:13px;color:var(--dim);margin-top:6px;letter-spacing:.04em;text-transform:uppercase}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{font-size:13px;padding:4px 10px;border:1px solid var(--line);border-radius:999px;color:var(--ink);background:#fff}.chip.ok{border-color:#2f7d4f;color:#2f7d4f}.chip.warn{border-color:#a8741a;color:#a8741a}.chip.danger{border-color:#9E3B33;color:#9E3B33}
.steps5{display:grid;gap:12px}.steps5>div{display:flex;gap:12px;align-items:baseline}.steps5>div>div{display:block}.steps5 i{font:600 14px/1 Fraunces,serif;color:#fff;background:var(--ink);border-radius:999px;min-width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;font-style:normal}.steps5 b{font-weight:600}.steps5 span{color:var(--dim);font-size:14px}
</style>
</head>
<body>
<div id="stage">
  <div class="hdr"><span>DXP // <b>RESEARCH ASSISTANT PROPOSAL</b></span><span id="meta"></span></div>
  <div id="view"></div>
  <div class="note" id="note"></div>
  <div class="ftr"><span id="hint"></span><span>ANSWERS THAT CARRY THEIR PROOF</span></div>
  <div class="prog" id="prog"></div>
</div>

<script>
(function () {
  var state = { i: 0, notes: false };

  function title(t) { return '<h2>' + t + '</h2>'; }
  function card(cls, inner) { return '<div class="card ' + (cls || '') + '">' + inner + '</div>'; }
  function cards(cls, items) { return items.map(function (x) { return card(cls, '<p>' + x + '</p>'); }).join(''); }
  function table(cls, head, rows) {
    return '<table class="' + (cls || '') + '"><tr>' + head.map(function (h) { return '<th>' + h + '</th>'; }).join('') + '</tr>' +
      rows.map(function (r) { return '<tr>' + r.map(function (c) {
        var m = /^\{(ok|warn|danger)\}(.*)$/.exec(c);
        return m ? '<td class="' + m[1] + '">' + m[2] + '</td>' : '<td>' + c + '</td>'; }).join('') + '</tr>'; }).join('') + '</table>';
  }
  function step(n, t, s, cls) { return card(cls, '<div class="lbl">' + n + '</div><div class="t">' + t + '</div><p class="dim">' + s + '</p>'); }
  function arr() { return '<div class="arr"></div>'; }
  function shot(file, cap, h) { return '<figure class="shot' + (h === 2 ? ' h2' : h ? ' h' : '') + '"><img src="deck-assets/' + file + '" alt="' + cap + '">' + (cap ? '<figcaption>' + cap + '</figcaption>' : '') + '</figure>'; }
  function kv(items) { return '<div class="kv">' + items.map(function (x) { return '<div><b>' + x[0] + '</b><span>' + x[1] + '</span></div>'; }).join('') + '</div>'; }
  function chips(items) { return '<div class="chips">' + items.map(function (x) { var m = /^\{(ok|warn|danger)\}(.*)$/.exec(x); return '<span class="chip ' + (m ? m[1] : '') + '">' + (m ? m[2] : x) + '</span>'; }).join('') + '</div>'; }

  var S = [
    // ---------- 1 PROBLEM ----------
    { sec: "PROBLEM", theme: "dark", cls: "between", html:
      '<div class="stack" style="gap:14px"><div class="kicker">MARC · client rehearsal · consolidated proposal</div><h1>Answers that carry their proof</h1></div>' +
      '<div class="stack" style="gap:12px"><p class="big" style="max-width:1000px">A reading room on top of MARC Online: ask a question across the reports a subscriber has bought, get the page for every claim, and have each quote checked against that page before anyone sees it.</p>' +
      '<p class="names">Adam · Fahim · Shananth · Irfan · Irfan Ali (team lead) · AI Research Intelligence Assistant · 10-week pilot · October 2026</p></div>',
      note: "Open with the problem, in full, before anything else. Say who we are in one sentence, then go straight to how the client works today. Do not describe the solution on this slide." },

    { sec: "PROBLEM", html:
      title("What we will cover, and what we are asking for") +
      '<div class="cols side"><ol style="font-size:20px;gap:10px">' +
      '<li>The problem as we understand it, and how your staff work today</li><li>What we propose to build and how an answer is made, end to end</li><li>What already runs, with its measured and unmeasured results</li><li>Stack, alternatives considered, cost, limits and maintenance</li><li>The 10-week plan and who owns each part</li><li>What we need from you before week 1 can start</li></ol>' +
      card("panel", '<h3>Three decisions we need today</h3><div class="stack" style="margin-top:10px"><p>Which library is the pilot, and who are the pilot users.</p><p>Which model provider and hosting region are acceptable for your research.</p><p>What result at week 10 would justify an enterprise build.</p></div>') + '</div>',
      note: "Name the three decisions up front. If they cannot decide today, ask who can and by when." },

    { sec: "PROBLEM", html:
      title("How a cross-report question is answered today") +
      '<p class="dim">A subscriber asks: how has the outlook for a sector changed over the last few reports? MARC Online filters by date and sorts by downloads. There is no search across report text, so a person does this loop by hand.</p>' +
      '<div class="flow">' + step("1", "Open one PDF", "Guess which report might cover it") + arr() + step("2", "Search inside it", "Keyword find, scroll, read around the hit") + arr() +
      step("3", "Note the figure", "Copy it out with the page, by hand") + arr() + step("4", "Open the next PDF", "Repeat for every report in scope") + arr() +
      step("5", "Stitch it together", "Nobody re-checks the figures against the pages", "soft") + '</div>' +
      card("panel", '<p><b>The knowledge is already in the company’s research.</b> The PDF format makes it slow to connect, so customers and the company’s own staff redo this work every time, and the result depends on who did it.</p>') +
      '<p class="dim" style="font-size:14px">From the brief and a signed-in walkthrough of MARC Online. How often this happens, and how long it takes, is yours to tell us.</p>',
      note: "This is our reading, not an observation. Ask: is this how it actually happens, who does it, how often, and how long does one question take? Their answer is the pilot baseline." },

    { sec: "PROBLEM", html:
      title("Pain points, and what a good outcome looks like") +
      '<div class="cols c2"><div class="stack"><h3>What hurts today</h3>' + cards("", [
        "<b>Slow.</b> Every cross-report question is a manual search across several PDFs.",
        "<b>Repeated.</b> The same question is answered again by the next person, from scratch.",
        "<b>Unverifiable.</b> A figure copied by hand has no link back to its page. Errors travel.",
        "<b>Locked value.</b> Customers cannot query the research they pay for, so its value is capped.",
        "<b>Investment risk.</b> An enterprise system is expensive before anyone has proved customers want it."]) + '</div>' +
      '<div class="stack"><h3 class="ok">Expected outcome at week 10</h3>' + cards("ok", [
        "<b>Minutes, not hours.</b> One question searches the whole permitted library and returns a cited answer.",
        "<b>Every claim has a page.</b> Click a citation and see the quote highlighted on the real page.",
        "<b>No false figures.</b> Measured on an agreed question set: zero figures stated that the page does not say. An answer beside the point goes to review, and is counted.",
        "<b>Access that cannot leak.</b> A user only ever sees passages from libraries they are granted.",
        "<b>A go or no-go number.</b> Pilot data that sizes the enterprise build, or shows cheaply why not."]) + '</div></div>',
      note: "Left is from the brief. Right is our proposal of what success means; the client has to agree it, especially the last row. Ask which of the five matters most." },

    // ---------- 2 SOLUTION ----------
    { sec: "SOLUTION", theme: "accent", cls: "center", html:
      '<div class="kicker">Our answer in one line</div><h1 style="font-size:64px;max-width:1100px">The assistant never shows an answer it cannot back up.</h1>' +
      '<p class="big" style="max-width:1000px">Every claim carries a page citation. Plain code, not a model, checks that the cited quote is on that page and that every number in the claim is in the quote. If the library does not support an answer, it says so.</p>',
      note: "Pause here. The differentiator is not AI over PDFs. It is the check that runs after the model and before the user, and that it is deterministic code anyone can audit." },

    { sec: "SOLUTION", html:
      title("What the user sees") +
      '<div class="cols side" style="grid-template-columns:7fr 5fr;gap:28px">' + shot("chat-answer.png", "The demo, as it runs today: a stored answer, its citation chip, and the quote one click away.", true) +
      '<div class="steps5" style="align-self:center">' +
      '<div><i>1</i><div><b>Ask in plain language</b><br><span>“The April 2024 monitor” in the question becomes a filter.</span></div></div>' +
      '<div><i>2</i><div><b>Watch the sources arrive</b><br><span>Only from reports this user may search.</span></div></div>' +
      '<div><i>3</i><div><b>See every claim checked</b><br><span>Quote on page N, or removed with the reason.</span></div></div>' +
      '<div><i>4</i><div><b>Read the cited answer</b><br><span>Click the chip: the quote on the page, and the PDF at that page.</span></div></div>' +
      '<div><i>5</i><div><b>Rate it, or hand it to a person</b><br><span>Nothing happens unless pressed.</span></div></div>' +
      '<div><i>·</i><div><b>Or an honest refusal</b><br><span>“Not found in your library”, closest pages shown. It does not guess.</span></div></div>' +
      '</div></div>',
      note: "If a live demo is possible, run it here: one safe question from the script, one that should refuse. The user picker is not a login; the real build gets your identity provider." },

    { sec: "SOLUTION", html:
      title("Architecture: how an answer is made") +
      '<div class="flow">' +
      card("", '<div class="lbl u">Ingest</div><div class="t">PDF, page by page</div><p class="dim">Page numbers kept. Scans flagged for OCR.</p>') + arr() +
      card("", '<div class="lbl u">Retrieve</div><div class="t">Granted reports only</div><p class="dim">Keyword plus meaning search. The grant is a join in the query.</p>') + arr() +
      card("soft", '<div class="lbl u" style="color:var(--accent)">Draft · model</div><div class="t">Claims with exact quotes</div><p>Sees only the retrieved passages.</p>') + arr() +
      card("ink", '<div class="lbl u" style="color:var(--almond)">Gate · plain code</div><div class="t">Quote on page? Numbers match?</div><p style="color:var(--almond)">Fail: retry once. Fail again: remove, or refuse.</p>') + arr() +
      card("", '<div class="lbl u">Show · audit</div><div class="t">Cited answer, page, PDF</div><p class="dim">Every question and outcome logged.</p>') + '</div>' +
      chips(["{ok}Runs today: ingest, retrieve, draft, gate, show, audit", "Our own store and front end; nothing touches MARC Online", "Reports and entitlements arrive by your API licence", "Model behind one interface: provider decided with you", "{warn}Meaning search and OCR: weeks 2 to 5"]),
      note: "Walk left to right. The model only ever sees passages the user may see. The gate is deterministic string checks, so it is auditable and costs no model call. It cannot judge relevance, which is why wrong-and-confident is measured." },

    { sec: "SOLUTION", html:
      title("The grounding gate: three rules, no model") +
      '<div class="cols c3">' +
      card("", '<div class="lbl">Rule 1</div><div class="t">The quote is on the cited page</div><p class="dim">Exact match. A paraphrase fails.</p><p style="font-family:ui-monospace,monospace;font-size:13px;margin-top:10px">“expanded by 4.4 percent in H1 2025” → <span class="ok">on p. 23</span></p>') +
      card("", '<div class="lbl">Rule 2</div><div class="t">Every number in the claim is in the quote, in a sentence</div><p class="dim">A number read off a chart axis does not count.</p><p style="font-family:ui-monospace,monospace;font-size:13px;margin-top:10px">“5.1 4.4 3.6 3.3 4.1 2025f” → <span class="danger">removed</span></p>') +
      card("", '<div class="lbl">Rule 3</div><div class="t">The page cited was one the model was shown</div><p class="dim">So it cannot cite a report the user may not see.</p><p style="font-family:ui-monospace,monospace;font-size:13px;margin-top:10px">doc 6, p. 1, no grant → <span class="danger">never retrieved</span></p>') + '</div>' +
      '<div class="cols side" style="margin-top:18px"><div class="flow">' + card("soft", '<div class="t">Fail</div><p class="dim">Retry once, with the reasons.</p>') + arr() + card("soft", '<div class="t">Fail again</div><p class="dim">Remove the claim.</p>') + arr() + card("ink", '<div class="t">Nothing survives</div><p style="color:var(--almond)">“Not found”, closest pages shown.</p>') + '</div>' +
      card("warn", '<p><b>What it cannot do.</b> Prove the claim answers the question. A true quote beside the point passes the gate; that is why wrong-and-confident is measured on a question set, not assumed.</p>') + '</div>',
      build: true,
      note: "Say the limit before the client finds it. Each rule has a test that fails when the rule is removed. The chart-axis example is a real catch from the Gemini runs." },

    { sec: "SOLUTION", html:
      title("Access control: enforced inside the search, not after it") +
      '<div class="cols side" style="grid-template-columns:5fr 7fr;gap:28px"><div class="steps5" style="align-self:center">' +
      '<div><i>1</i><div><b>Entitlements come from your subscriber export</b><br><span>We never read MARC Online.</span></div></div>' +
      '<div><i>2</i><div><b>The grant is a join in the search query</b><br><span>A passage you may not see is never returned, never reaches the model, is never cited.</span></div></div>' +
      '<div><i>3</i><div><b>The page and the PDF repeat the check</b><br><span>A guessed id returns nothing without the grant.</span></div></div>' +
      '<div><i>4</i><div><b>The trace names only your libraries</b><br><span>Every question, outcome and source is logged.</span></div></div>' +
      '<div><i>5</i><div><b>Documents are data, not instructions</b><br><span>Text in a PDF cannot change the assistant.</span></div></div>' +
      '<div><i>!</i><div><b class="warn">Not yet: real login</b><br><span>The demo has a user picker. The pilot gets your identity provider or invited users.</span></div></div>' +
      '</div>' + shot("chat-steps.png", "Investigation steps: the search names only the libraries this user holds; each step marked plain code or model call, with its duration.", true) + '</div>',
      note: "Access was a hard requirement in the brief. Design done and tested: a test fails if the join is removed. Login depends on their identity provider." },

    // ---------- 3 WHAT EXISTS ----------
    { sec: "WHAT EXISTS", theme: "panel", html:
      title("What runs today") +
      kv([["87", "automated tests"], ["5", "public reports, 490 pages"], ["3", "models, 19 measured runs"], ["0", "false figures in 285 attempts"]]) +
      '<div class="cols side" style="grid-template-columns:8fr 4fr;gap:28px">' + shot("user-board.png", "A subscriber’s board: library with PDF and ask links, an analysis across five editions, answers, ratings, review requests.", 2) +
      '<div class="stack" style="gap:10px;align-self:center">' + chips(["{ok}Chat, sources, checks, cited answer", "{ok}Quote on the page, PDF at that page", "{ok}History replays without a model call", "{ok}Library, analyses, user board", "{ok}Admin board, add user, API keys", "{ok}Evaluation harness, three models", "{warn}Comparisons: split", "{danger}PostgreSQL, React, OCR, your login: weeks 2 to 6"]) + '</div></div>',
      note: "Do not oversell: real reports, never a client document. Give us five reports and it runs the same day; the quality number takes the question set." },

    { sec: "WHAT EXISTS", theme: "panel", html:
      title("What the admin sees") +
      '<div class="cols side" style="grid-template-columns:8fr 4fr;gap:28px">' + shot("admin-board.png", "One screen: a brief since the last look, key figures, what to do and why, reports by edition, coverage, recent questions, saved runs.", true) +
      '<div class="stack" style="gap:10px;align-self:center">' + chips(["Counts and names, never answer text", "To do, each with its reason", "Reports on a timeline, sized by citations", "Pages flagged for OCR", "Every saved evaluation run", "Add a user, create and revoke API keys", "Try a question as any user", "Layout is a JSON document per owner"]) + '</div></div>',
      note: "The admin never sees answer text; that stays with the user who asked. Expand a panel to show the layout document at work." },

    { sec: "WHAT EXISTS", html:
      title("Results so far: what is measured, what is not") +
      '<div class="cols side"><div class="stack" style="gap:14px">' +
      '<h3>Retrieval: is the right page in the top 12?</h3>' + table("sm wrap", ["Question type", "Right page found"], [["Single report, 12 questions", "{ok}12 of 12"], ["Two reports, 3 questions", "{ok}3 of 3 get both pages"]]) + '<p class="dim" style="font-size:15px">Right page in the top 12 across the set: 1.0, up from 0.867 after the edition words left the query and every report kept two slots.</p>' +
      '<p class="dim" style="font-size:15px">Nothing was tuned on these questions; 19 anchors were added after checking pages by hand, because the reports repeat forecasts in the summary.</p>' +
      '<h3>Model-free baselines, as a floor</h3>' + table("sm wrap", ["Baseline", "Correct", "Timid", "Wrong and confident"], [["Quote the best sentence", "1 of 15", "0", "{danger}21 of 22"], ["Refuse on weak match", "0 of 15", "9", "{danger}9 of 22"]]) +
      card("warn", '<p><b>Opposite failures.</b> Small model refuses half of what it could answer. Large ones answer beside the point 1 to 2 times a run, only on comparisons: a true figure, half an answer. Zero-false comes first.</p>') + '</div>' +
      '<div class="stack">' + card("ink", '<div class="lbl u" style="color:var(--almond)">False figures stated as fact, 3 models, 19 runs</div><div class="num">0 of 285</div><p>No model stated a false figure. The gate removed up to 6 in 10 of the large models’ drafts, one read off a chart.</p>') +
      table("sm", ["Model", "Correct", "Timid", "Refused right", "Wrong, confident"], [["Qwen · 10 runs", "5 to 9", "6 to 10", "7 of 7", "{ok}0"], ["Gemini · 3", "11 to 12", "0 to 2", "6 to 7", "{danger}2 to 4"], ["Gemini · 3, figure rule", "10 to 12", "2 to 3", "7 of 7", "{warn}1 to 2"], ["Claude Sonnet 5.5 · 3", "10 to 12", "2 to 3", "7 of 7", "{warn}1 to 2"]]) + '</div></div>',
      note: "Lead with the zero, then say what it does not mean: the model refuses a lot, and cross-report questions always. The model measured is Qwen 3.8 27B through Nous Research, and Gemini and Claude Sonnet through the same endpoint; the demo runs on Qwen. The baselines prove a model-free approach cannot work." },

    // ---------- 4 TECHNOLOGY ----------
    { sec: "TECHNOLOGY", html:
      title("Technology: what we propose and why") +
      table("sm wrap", ["Layer", "Pilot choice", "Why", "In the slice today"], [
        ["Back end", "Python, FastAPI", "Strong PDF and evaluation libraries, typed API, easy to test", "{ok}Same"],
        ["Store and search", "PostgreSQL with pgvector, our own, encrypted at rest", "Passages, vectors and audit in one store. Nothing read from or written to MARC Online; metadata and entitlements come from the API you license to us", "{warn}SQLite FTS5, keyword only"],
        ["PDF reading", "poppler page extraction, OCR fallback, table extraction", "Keeps page numbers, which citations need; reading-order mode handles two-column pages", "{warn}poppler only, OCR flagged not run"],
        ["Model", "Any Anthropic or OpenAI-compatible model, behind a thin interface", "Provider, region and retention decided with you in week 1. One adapter file to swap", "{ok}Measured on Qwen 3.8 27B, Gemini 4 Argon and Claude Sonnet 5.5, one adapter"],
        ["Front end", "React web app", "Chat, page viewer and admin screens need component state and accessibility work", "{warn}One plain HTML page"],
        ["Files", "Private object storage", "Original PDFs, page images, retention rules", "{warn}Local files"],
        ["Login", "Our app’s login: your identity provider if you allow it, else invited users", "A standalone system; nothing changes in MARC Online", "{danger}Demo user picker"],
        ["Hosting", "Our own, in a Malaysian region unless you say otherwise", "Licensed research text: encrypted, access-logged, retained on your terms, never sent to a model provider without your consent", "{danger}Laptop"]]) +
      '<p class="dim" style="font-size:14px">The gate, loop, trace, access rule and question set carry over unchanged when store and front end are swapped: they depend on a retrieval function and a model interface, not on SQLite or the page.</p>',
      note: "The right column is deliberate: the slice used the lightest thing that proves each idea. Migration is weeks 2 to 3 and does not touch the parts that matter. A mandated cloud or provider changes two rows and nothing else." },

    { sec: "TECHNOLOGY", html:
      title("Alternatives considered") +
      table("sm wrap", ["Option", "Strength", "Why not here", "When it wins"], [
        ["<b>This build</b>", "Quote and number checked before display; access in the query; measured", "More engineering; quality needs the question set", "{ok}A wrong figure costs more than the build"],
        ["Managed RAG (Vertex, Azure, Bedrock)", "First answer in days", "Cites a chunk, not a checked quote; no number check", "Chunk citations are enough"],
        ["Copilot, NotebookLM", "Zero build", "No per-customer library, no eval, no audit", "Internal staff only"],
        ["Separate vector database", "Scale, richer ranking", "Access rule in two places", "Enterprise volume"],
        ["Self-hosted open model", "Data never leaves", "GPU cost; more refusals", "No provider terms acceptable"]]) +
      card("soft", '<p><b>Candid view.</b> “Chat with our PDFs” for staff is cheaper on a managed service, and we would say so. The build buys two things they do not: claims checked against the page, and a wrong-and-confident rate you can show customers.</p>'),
      build: true,
      note: "Expect “why not just use Copilot or Vertex”. Answer it before it is asked. The model is swappable; nothing stops us running on their preferred provider." },

    { sec: "TECHNOLOGY", html:
      title("Expected running cost of the pilot") +
      '<div class="cols side"><div class="stack" style="gap:12px">' +
      '<h3>Model cost per question, indicative</h3>' + table("sm wrap", ["Model", "List price per 1M tokens in / out", "One question, with retry"], [["Claude Sonnet 5.5 (proposed)", "USD 2 / 10", "About 1.5 to 3 US cents"], ["Claude Opus 5.5", "USD 4 / 20", "About 3 to 6 US cents"], ["Claude Haiku 5.5", "USD 0.10 / 0.50", "Under 0.2 US cents"]]) +
      '<p class="dim" style="font-size:14px">Assumes 12 passages of about 350 tokens each plus a short answer, roughly 5,000 input and 400 output tokens per call. Prompt caching cuts the input side further. Measured per question during the pilot, not assumed.</p>' +
      '<h3>Platform, per month</h3>' + table("sm wrap", ["Item", "Indicative"], [["Cloud Run service, scales to zero", "USD 20 to 60"], ["Cloud SQL for PostgreSQL, small instance", "USD 40 to 90"], ["Object storage, logging", "Under USD 10 at pilot volume"], ["OCR for scanned pages, one-off", "About USD 1.50 per 1,000 pages"]]) + '</div>' +
      '<div class="stack">' + card("ink", '<div class="lbl u" style="color:var(--almond)">Pilot at 2,000 questions a month</div><div class="num">Under USD 250</div><p>per month for model and platform together, on list prices as of October 2026.</p>') +
      card("warn", '<p><b>The real cost is people.</b> Five developers for ten weeks, plus your research staff’s time to write and grade 60 to 100 questions. That staff time is the one input we cannot substitute.</p>') + '</div></div>' +
      '<p class="dim" style="font-size:14px">Indicative figures on public list prices; to be confirmed against the chosen provider and region.</p>',
      note: "Give the per-question figure, then stop. The model is a rounding error at pilot scale. What costs money is engineering time and their researchers’ time. Do not quote a people cost here; that is a commercial conversation." },

    { sec: "TECHNOLOGY", html:
      title("Limitations and what it takes to maintain") +
      '<div class="cols c2"><div class="stack"><h3 class="danger">Limits, stated plainly</h3>' + cards("", [
        "<b>Charts are not read.</b> The assistant cites a chart’s page and caption and quotes figures stated in the text. It does not read values off a picture.",
        "<b>Numbers written as words are not checked.</b> “four percent” passes the number check; “4 percent” is verified.",
        "<b>Meaning is not checked.</b> A quote can be on the page and still not support the claim. A reviewer can disagree with a passing claim.",
        "<b>Scanned and table-heavy reports are the risk.</b> We have only run on clean, born-digital reports so far. Your layouts may differ.",
        "<b>A small question set is a signal, not proof.</b> The pilot gate needs 60 to 100 questions graded by your staff."]) + '</div>' +
      '<div class="stack"><h3 class="ok">Maintenance after week 10</h3>' + cards("ok", [
        "<b>Adding a report</b> is an admin upload. The ingestion quality report flags pages that need attention. No developer needed.",
        "<b>Changing the model</b> is one adapter file. The evaluation runs on every change, so a regression is visible before users see it.",
        "<b>Growing the question set</b> happens from user feedback: a thumbs-down with a reason becomes a new test question.",
        "<b>Ongoing effort</b> at pilot scale: a part-time owner for uploads and grants, and a developer on call for model or provider changes."]) +
      card("panel", '<p><b>Handover</b> includes the runbook, the test suite and the question set, so your team or ours can carry it on.</p>') + '</div></div>',
      note: "The weakest point is the fourth limit: we have never ingested a client document. Ask for five reports today, including the ugliest scanned one and the most table-heavy one." },

    // ---------- 5 PLAN ----------
    { sec: "PLAN", theme: "panel", html:
      title("The 10-week plan") +
      table("sm wrap", ["Weeks", "Milestone", "Work", "Done when"], [
        ["1", "<b>Discovery and first measurement</b>", "Five sample reports ingested and the 22-question harness run on them, three times. Pilot series, users and gate thresholds agreed. Provider, region, retention decided. Question set drafting starts with your staff.", "Wrong-and-confident measured on your reports. Client signs off series, gates and provider."],
        ["2 to 3", "<b>Your reports answered while the store is built</b>", "The demo keeps answering your sample reports from week 1; PostgreSQL, encrypted storage and access logging are built beside it. Comparisons asked one side at a time, joined in plain code. Analyses across your editions. OCR path, ingestion report, filters.", "Right page in the top results on your reports. Both sides of every comparison cited. One analysis across your editions."],
        ["4 to 5", "<b>Answer and verify, on the production front end</b>", "Follow-up rewriting. Table extraction and citation. React front end over the same API, page viewer and PDF link carried across. The store switch, question set run before and after.", "No unverified claim reaches a user. The question set scores the same on the new store."],
        ["6", "<b>Access and admin</b>", "Login to our app. Roles and library grants from your subscriber export. Admin upload, replace, retire. Audit log export. Buffer week: the admin and user boards are already built.", "Every access question in the set is refused correctly."],
        ["7", "<b>Evaluate</b>", "Evaluation dashboard on the full question set. Feedback loop into the set. Baseline timing of five questions done by hand.", "Dashboard runs on every change. Baseline recorded."],
        ["8 to 9", "<b>Pilot</b>", "Real users on the pilot library. Track questions, share with verified citations, ratings, time versus baseline, cost per question. Fix what the pilot finds.", "Two weeks of pilot data collected."],
        ["10", "<b>Gate and handover</b>", "Results against the agreed thresholds. Enterprise sizing from measured volume and cost. Runbook, tests and question set handed over.", "Go or no-go decision made on measured results."]]) +
      '<p class="dim" style="font-size:14px">Cut from the bottom if short, never the gate or access control. The model is the measured quality lever: see slide 11 before choosing a provider.</p>',
      build: true,
      note: "Week 1 is front-loaded with client decisions. If they slip, everything slips. Weeks 8 to 9 depend on pilot users actually using it; ask the client to name them now." },

    { sec: "PLAN", html:
      title("What you will see at each checkpoint") +
      '<div class="cols c4">' +
      card("", '<div class="lbl">End of week 1</div><p>The real model’s score on the 22-question set, and your five sample reports ingested with their quality reports.</p>') +
      card("", '<div class="lbl">End of week 3</div><p>Your pilot library searchable. Retrieval hit rate on your own questions, keyword and meaning search side by side.</p>') +
      card("", '<div class="lbl">End of week 5</div><p>Cited answers on your reports, including cross-report comparisons, in the real front end with the page viewer.</p>') +
      card("", '<div class="lbl">End of week 7</div><p>Login with your identity provider, admin upload, and the evaluation dashboard on the full question set.</p>') + '</div>' +
      '<div class="cols side">' +
      card("ink", '<div class="lbl">End of week 10: the gate review</div><p>Pilot numbers against the thresholds you set in week 1: share of questions answered with verified citations, ratings, time to answer against the hand baseline, cost per question, and wrong-and-confident on the full set.</p>') +
      card("soft", '<div class="lbl">Then one of two outcomes</div><p>Thresholds met: the same measurements size the enterprise build. Not met: the evaluation shows exactly where, and you stop having spent little.</p>') + '</div>',
      note: "Each checkpoint is a thing the client can see, not a status report. Offer a 30-minute review at each one. The week 10 thresholds must be the client’s numbers, agreed in week 1." },

    { sec: "PLAN", html:
      title("Roles and responsibilities") +
      table("sm", ["Who", "Owns", "Covers", "Busiest in"], [
        ["<b>Irfan Ali</b><br>Team lead", "Verification and evaluation", "Grounding gate, question set with your staff, evaluation dashboard, gate review. Single point of contact for the client. Built the demo slice.", "Weeks 1, 7, 10"],
        ["<b>Adam</b>", "Ingestion", "Upload, page-aware reading, OCR fallback, table extraction, ingestion quality report, superseded flags.", "Weeks 1 to 3"],
        ["<b>Fahim</b>", "Retrieval", "PostgreSQL with vectors and full-text, hybrid ranking, filters, comparison and follow-up query rewriting.", "Weeks 2 to 5"],
        ["<b>Shananth</b>", "Access and admin", "Login with your identity provider, roles, library grants, admin screens, audit log, hosting and deployment.", "Weeks 2, 6, 8"],
        ["<b>Irfan</b>", "Interface", "React front end, chat and canvas, citation page viewer, investigation steps, feedback, review requests.", "Weeks 4 to 9"]]) +
      '<div class="cols c3">' +
      card("panel", '<p><b>Everyone knows the whole pipeline.</b> Each owner can explain how an answer is made end to end and run the demo. Ownership is who answers first, not who works alone.</p>') +
      card("panel", '<p><b>Pilot weeks are shared.</b> In weeks 8 to 9 everyone rotates on pilot support and fixes, so no single area blocks the gate.</p>') +
      card("ok", '<p><b>One point of contact.</b> Irfan Ali answers for the team; each area has one owner and a named second. Areas and the lead do not change during the pilot.</p>') + '</div>',
      note: "Each person should be ready to answer one question outside their own area." },

    { sec: "PLAN", html:
      title("What we need to ask you before week 1") +
      '<div class="cols c3 qa">' +
      card("", '<h3>Workflow</h3><ul><li>Who answers cross-report questions today, and how long does one take?</li><li>The five questions customers ask most?</li><li>Who reviews an answer before a customer sees it?</li></ul>') +
      card("", '<h3>The library</h3><ul><li>Which series is the pilot, how many reports?</li><li>What does the API licence expose, and its limits?</li><li>Sample PDFs with metadata: the oldest sold, the most table-heavy?</li></ul>') +
      card("", '<h3>People and grading</h3><ul><li>Who writes and grades 60 to 100 questions with us?</li><li>Who are the pilot users?</li><li>What rating, time saving and cost justify an enterprise build?</li></ul>') +
      card("", '<h3>Data and providers</h3><ul><li>May research text go to a model API, and in which region?</li><li>Retention, no-training, encryption terms? Who audits us?</li><li>Are entitlements contractual, so access is compliance?</li></ul>') +
      card("", '<h3>Access</h3><ul><li>Our app beside MARC Online: acceptable for the pilot?</li><li>Your identity provider, or users we invite?</li><li>Who else queries this: analysts, MARC Data?</li></ul>') +
      card("soft", '<h3>Blocks week 1</h3><ul><li>Five sample reports, this week</li><li>A research contact for the question set</li><li>Provider and region</li><li>A sponsor who signs off the gates</li></ul>') + '</div>',
      note: "Assign each box to one team member to ask. Write the answers down in the meeting; they feed the assumptions slide. The pink box is the ask to close on." },

    { sec: "PLAN", html:
      title("Assumptions: known, assumed, to confirm") +
      '<div class="cols c3"><div class="stack">' + card("ok", '<h3 class="ok">Known from the brief</h3>') + cards("", [
        "Questions span reports; answers cite document and page.",
        "Reports are PDFs. Ingest and retrieval must be efficient.",
        "Access is restricted to authorised users and libraries.",
        "Quality and value are evaluated before an enterprise build.",
        "Ten weeks. Nice-to-haves: history, filters, admin, feedback, tables, roles."]) + '</div>' +
      '<div class="stack">' + card("warn", '<h3 class="warn">We are assuming</h3>') + cards("", [
        "Born-digital English PDFs; scans a minority.",
        "MARC Online stays the system of record; we never read it. Data arrives by API licence and samples.",
        "An API model provider is acceptable with no-training and regional terms.",
        "Research staff give half a day a week to the question set, weeks 1 to 7.",
        "A standalone system is what you want."]) + '</div>' +
      '<div class="stack">' + card("soft", '<h3>Must confirm with you</h3>') + cards("", [
        "Pilot series, report count, pilot users.",
        "Provider, region, retention, no-training terms.",
        "What the API licence exposes; the sample data.",
        "Week 10 thresholds: time saving, rating, cost per question.",
        "Whether library boundaries are contractual."]) + '</div></div>' +
      '<p class="dim" style="font-size:14px">The brief gave no volumes, library size or thresholds; nothing on this slide is a measured client fact.</p>',
      note: "Read the right column aloud and ask for answers on the spot. Anything unanswered becomes a week 1 blocker." },

    { sec: "PLAN", html:
      title("Risks, and how each is handled") +
      table("sm wrap", ["Risk", "Handled by", "Owner"], [
        ["<b>A figure the sources do not say</b>", "Quote and number check, one retry, then refusal. Measured on every change.", "Irfan Ali"],
        ["<b>Messy PDFs</b>", "Ingestion report per document; weak pages flagged, never trusted.", "Adam"],
        ["<b>A comparison misses one side</b>", "One query per report, joined in plain code; re-measured.", "Fahim"],
        ["<b>A customer sees research they did not buy</b>", "Grant in the query and on the page route; tests and access questions.", "Shananth"],
        ["<b>Research text leaves the company</b>", "Provider chosen with you: no training, agreed region and retention.", "Shananth"],
        ["<b>Week 1 decisions slip</b>", "Named sponsor and five sample reports asked for today.", "Irfan Ali"],
        ["<b>Pilot users do not use it</b>", "Named users and seeded questions in week 1; usage tracked weekly from week 8.", "Irfan"]]),
      build: true,
      note: "The two risks the client controls are the last two rows. Ours is engineering, theirs is decisions and participation; the plan fails without both." },

    { sec: "CLOSE", theme: "dark", cls: "between", html:
      '<div class="stack" style="gap:14px"><div class="kicker">To close</div><h1 style="font-size:60px;max-width:1100px">Answers that carry their proof. Access that cannot leak. A pilot that tells you whether to invest.</h1></div>' +
      '<div class="cols c3">' +
      card("ink2", '<div class="lbl">We need from you this week</div><p>Five sample reports, a research contact, a sponsor, and a provider decision.</p>') +
      card("ink2", '<div class="lbl">You get at the end of week 1</div><p>Your own reports in the demo, three models measured on them, and your first analysis across editions.</p>') +
      card("accent", '<div class="lbl">At week 10</div><p>A go or no-go decision on your numbers, not ours.</p>') + '</div>' +
      '<p class="names">Adam · Fahim · Shananth · Irfan · Irfan Ali</p>',
      note: "End on the three boxes and stop talking. Then ask for the sponsor’s name and the date for the five sample reports before the meeting ends." }
  ];

  var view = document.getElementById("view"), stage = document.getElementById("stage");
  function pad(n) { return n < 10 ? "0" + n : "" + n; }

  function render() {
    var s = S[state.i];
    stage.className = (s.theme || "") + (state.notes ? " notes" : "");
    view.innerHTML = '<div class="slide ' + (s.cls || "") + '">' + s.html + '</div>';
    document.getElementById("note").textContent = s.note || "";
    document.getElementById("meta").innerHTML = s.sec + ' &nbsp; <b>' + pad(state.i + 1) + ' / ' + S.length + '</b>';
    document.getElementById("hint").textContent = (s.build ? "→ reveals, then " : "") + "← → slides | N notes | F fullscreen | Home / End";
    document.getElementById("prog").style.width = ((state.i + 1) / S.length * 100) + "%";
    try { location.hash = String(state.i + 1); } catch (e) {}
    if (s.build) { view.querySelectorAll("table tr:not(:first-child), .cols > .card").forEach(function (el) { el.classList.add("b"); }); }
  }
  // Don't show everything at once: on a build slide, the right arrow reveals the next row before it moves on.
  function reveal() { var next = view.querySelector(".b"); if (!next) return false; next.classList.remove("b"); return true; }
  function go(d) { if (d > 0 && reveal()) return; var n = Math.max(0, Math.min(S.length - 1, state.i + d)); if (n !== state.i) { state.i = n; render(); } }

  document.addEventListener("keydown", function (e) {
    var k = e.key;
    if (k === "ArrowRight" || k === "PageDown" || k === " " || k === "Enter") go(1);
    else if (k === "ArrowLeft" || k === "PageUp" || k === "Backspace") go(-1);
    else if (k === "Home") { state.i = 0; render(); }
    else if (k === "End") { state.i = S.length - 1; render(); }
    else if (k === "n" || k === "N") { state.notes = !state.notes; render(); }
    else if (k === "f" || k === "F") { if (!document.fullscreenElement) { document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); } else { document.exitFullscreen(); } }
  });
  stage.addEventListener("click", function (e) { if (e.target.closest("a")) return; go(e.clientX < window.innerWidth / 3 ? -1 : 1); });

  function fit() { stage.style.transform = "scale(" + Math.min(window.innerWidth / 1280, window.innerHeight / 720) + ")"; }
  window.addEventListener("resize", fit);
  fit();

  var h = parseInt((location.hash || "").replace("#", ""), 10);
  if (h >= 1 && h <= S.length) state.i = h - 1;
  render();
})();
</script>
