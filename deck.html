<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Research Assistant Client Proposal</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400..700&family=Geist:wght@400..700&display=swap">
<style>
  :root {
    --bg: #FAF6EE;
    --panel: #F4ECE0;
    --card: #FFFFFF;
    --fg: #1B1613;
    --dim: #7A7066;
    --line: #ECE3D6;
    --accent: #9E3B33;
    --accent-ink: #FDF0EE;
    --accent-soft: #F3E1DE;
    --accent-soft-ink: #7A2A24;
    --almond: #EED3BA;
    --ok: #3F7A54; --ok-soft: #E3F0E7; --ok-ink: #2C5B3C;
    --warn: #B6791F; --warn-soft: #F6EAD2; --warn-ink: #7C5410;
    --danger: #C0392B;
    --ink: #1B1613; --ink2: #2A2320;
    --serif: "Fraunces", "Iowan Old Style", Georgia, serif;
    --sans: "Geist", "Helvetica Neue", Arial, system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #1B1613; color: var(--fg); overflow: hidden; }
  body { font-family: var(--sans); display: grid; place-items: center; }

  #stage {
    width: 1280px; height: 720px; position: relative; flex: none;
    transform-origin: center center; background: var(--bg); color: var(--fg);
    border: 1px solid var(--line);
  }
  #stage.dark { background: var(--ink); color: var(--bg); }
  #stage.accent { background: var(--accent); color: var(--accent-ink); }
  #stage.panel { background: var(--panel); }

  .hdr {
    position: absolute; top: 22px; left: 56px; right: 56px;
    display: flex; justify-content: space-between;
    font: 500 12px var(--sans); letter-spacing: .18em; text-transform: uppercase; color: var(--dim);
  }
  .hdr b { color: var(--accent); font-weight: 600; }
  #stage.dark .hdr, #stage.accent .hdr { color: var(--almond); }
  #stage.dark .hdr b, #stage.accent .hdr b { color: var(--almond); }

  .slide { position: absolute; inset: 64px 56px 52px 56px; display: grid; gap: 22px; align-content: start; }
  .slide.center { align-content: center; }
  .slide.between { align-content: space-between; }

  h1 { font: 500 72px/1.05 var(--serif); letter-spacing: -.01em; max-width: 1050px; }
  h2 { font: 500 44px/1.1 var(--serif); letter-spacing: -.01em; }
  h3 { font: 600 15px var(--sans); letter-spacing: .16em; text-transform: uppercase; color: var(--accent); }
  h3.ok { color: var(--ok); } h3.warn { color: var(--warn-ink); } h3.danger { color: var(--danger); }
  .kicker { font: 600 14px var(--sans); letter-spacing: .22em; text-transform: uppercase; color: var(--accent); }
  #stage.dark .kicker, #stage.accent .kicker { color: var(--almond); }
  p, li { font-size: 18px; line-height: 1.4; }
  p.big { font-size: 24px; line-height: 1.35; }
  p.dim { color: var(--dim); }
  #stage.dark p.dim { color: var(--almond); }
  ul, ol { padding-left: 22px; display: grid; gap: 8px; }
  ol li::marker { color: var(--accent); font-weight: 600; }

  .cols { display: grid; gap: 20px; align-items: start; }
  .cols.c2 { grid-template-columns: 1fr 1fr; }
  .cols.c3 { grid-template-columns: 1fr 1fr 1fr; }
  .cols.c4 { grid-template-columns: repeat(4, 1fr); }
  .cols.side { grid-template-columns: 1fr 400px; }
  .stack { display: grid; gap: 10px; align-content: start; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 14px 18px; }
  .card p { font-size: 17px; }
  .card.soft { background: var(--accent-soft); border-color: var(--almond); color: var(--accent-soft-ink); }
  .card.ok { background: var(--ok-soft); border-color: var(--ok-soft); color: var(--ok-ink); }
  .card.warn { background: var(--warn-soft); border-color: var(--warn-soft); color: var(--warn-ink); }
  .card.panel { background: var(--panel); border-color: var(--panel); }
  .card.ink { background: var(--ink); border-color: var(--ink); color: var(--bg); }
  .card.ink .lbl, .card.ink h3 { color: var(--almond); }
  .card.ink2 { background: var(--ink2); border-color: var(--ink2); color: var(--bg); }
  .card.ink2 .lbl { color: var(--almond); }
  .card.accent { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .card.accent .lbl { color: var(--accent-ink); }
  .card .lbl { font: 600 14px var(--sans); color: var(--accent); margin-bottom: 6px; }
  .card .lbl.u { letter-spacing: .14em; text-transform: uppercase; font-size: 13px; color: var(--dim); }
  .card .t { font-size: 19px; font-weight: 600; line-height: 1.25; margin-bottom: 4px; }
  .cols.tight .card { padding: 9px 13px; }
  .cols.tight .card p { font-size: 15px; line-height: 1.3; }
  .cols.tight .stack { gap: 7px; }
  .cols.qa .card { padding: 10px 14px; }
  .cols.qa ul { margin-top: 6px; gap: 5px; padding-left: 18px; }
  .cols.qa li { font-size: 15px; line-height: 1.3; }
  .card .num { font: 500 56px/1 var(--serif); margin: 6px 0 10px; }

  .flow { display: flex; align-items: stretch; gap: 8px; }
  .flow .card { flex: 1; }
  .flow .arr { align-self: center; width: 0; height: 0; border-top: 9px solid transparent; border-bottom: 9px solid transparent; border-left: 16px solid var(--almond); flex: none; }

  table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--line); font-size: 16px; }
  th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; line-height: 1.3; }
  th { background: var(--ink); color: var(--bg); font-weight: 600; font-size: 14px; letter-spacing: .04em; }
  tr:nth-child(odd) td { background: var(--bg); }
  td:last-child { white-space: nowrap; }
  table.wrap td:last-child { white-space: normal; }
  td.ok { color: var(--ok); font-weight: 600; } td.warn { color: var(--warn); font-weight: 600; } td.danger { color: var(--danger); font-weight: 600; }
  table.sm { font-size: 15px; } table.sm th, table.sm td { padding: 7px 10px; }

  .names { font-size: 17px; color: var(--almond); }
  .ftr { position: absolute; left: 56px; right: 56px; bottom: 18px; display: flex; justify-content: space-between; font: 500 12px var(--sans); color: var(--dim); letter-spacing: .06em; }
  #stage.dark .ftr, #stage.accent .ftr { color: var(--almond); }
  .prog { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--accent); transition: width .2s; }
  #stage.accent .prog { background: var(--almond); }
  .note { position: absolute; left: 56px; right: 56px; bottom: 44px; display: none; background: var(--ink); color: var(--bg); padding: 12px 16px; border-radius: 8px; font-size: 15px; line-height: 1.4; }
  #stage.notes .note { display: block; }
</style>
</head>
<body>
<div id="stage">
  <div class="hdr"><span>DXP // <b>RESEARCH ASSISTANT PROPOSAL</b></span><span id="meta"></span></div>
  <div id="view"></div>
  <div class="note" id="note"></div>
  <div class="ftr"><span id="hint"></span><span>ANSWERS THAT CARRY THEIR PROOF</span></div>
  <div class="prog" id="prog"></div>
</div>

<script>
(function () {
  var state = { i: 0, notes: false };

  function title(t) { return '<h2>' + t + '</h2>'; }
  function card(cls, inner) { return '<div class="card ' + (cls || '') + '">' + inner + '</div>'; }
  function cards(cls, items) { return items.map(function (x) { return card(cls, '<p>' + x + '</p>'); }).join(''); }
  function table(cls, head, rows) {
    return '<table class="' + (cls || '') + '"><tr>' + head.map(function (h) { return '<th>' + h + '</th>'; }).join('') + '</tr>' +
      rows.map(function (r) { return '<tr>' + r.map(function (c) {
        var m = /^\{(ok|warn|danger)\}(.*)$/.exec(c);
        return m ? '<td class="' + m[1] + '">' + m[2] + '</td>' : '<td>' + c + '</td>'; }).join('') + '</tr>'; }).join('') + '</table>';
  }
  function step(n, t, s, cls) { return card(cls, '<div class="lbl">' + n + '</div><div class="t">' + t + '</div><p class="dim">' + s + '</p>'); }
  function arr() { return '<div class="arr"></div>'; }

  var S = [
    // ---------- 1 PROBLEM ----------
    { sec: "PROBLEM", theme: "dark", cls: "between", html:
      '<div class="stack" style="gap:14px"><div class="kicker">Client rehearsal · consolidated proposal</div><h1>Answers that carry their proof</h1></div>' +
      '<div class="stack" style="gap:12px"><p class="big" style="max-width:980px">A research assistant that answers questions across a PDF library, cites the page for every claim, and checks each quote against that page before anyone sees it.</p>' +
      '<p class="names">Adam · Fahim · Shananth · Irfan · Irfan Ali (team lead) · AI Research Intelligence Assistant · 10-week pilot · October 2026</p></div>',
      note: "Open with the problem, in full, before anything else. Say who we are in one sentence, then go straight to how the client works today. Do not describe the solution on this slide." },

    { sec: "PROBLEM", html:
      title("What we will cover, and what we are asking for") +
      '<div class="cols side"><ol style="font-size:20px;gap:10px">' +
      '<li>The problem as we understand it, and how your staff work today</li><li>What we propose to build and how an answer is made, end to end</li><li>What already runs, with its measured and unmeasured results</li><li>Stack, alternatives considered, cost, limits and maintenance</li><li>The 10-week plan and who owns each part</li><li>What we need from you before week 1 can start</li></ol>' +
      card("panel", '<h3>Three decisions we need today</h3><div class="stack" style="margin-top:10px"><p>Which library is the pilot, and who are the pilot users.</p><p>Which model provider and hosting region are acceptable for your research.</p><p>What result at week 10 would justify an enterprise build.</p></div>') + '</div>',
      note: "Name the three decisions up front. If they cannot decide today, ask who can and by when." },

    { sec: "PROBLEM", html:
      title("How a cross-report question is answered today") +
      '<p class="dim">A customer asks: how has the outlook for a sector changed over the last few reports? No single report answers it, so a person does this loop by hand.</p>' +
      '<div class="flow">' + step("1", "Open one PDF", "Guess which report might cover it") + arr() + step("2", "Search inside it", "Keyword find, scroll, read around the hit") + arr() +
      step("3", "Note the figure", "Copy it out with the page, by hand") + arr() + step("4", "Open the next PDF", "Repeat for every report in scope") + arr() +
      step("5", "Stitch it together", "Nobody re-checks the figures against the pages", "soft") + '</div>' +
      card("panel", '<p><b>The knowledge is already in the company’s research.</b> The PDF format makes it slow to connect, so customers and the company’s own staff redo this work every time, and the result depends on who did it.</p>') +
      '<p class="dim" style="font-size:14px">Our reading of the brief. To be confirmed with the client on this call.</p>',
      note: "This is our reading, not an observation. Ask: is this how it actually happens, who does it, how often, and how long does one question take? Their answer is the pilot baseline." },

    { sec: "PROBLEM", html:
      title("Pain points, and what a good outcome looks like") +
      '<div class="cols c2"><div class="stack"><h3>What hurts today</h3>' + cards("", [
        "<b>Slow.</b> Every cross-report question is a manual search across several PDFs.",
        "<b>Repeated.</b> The same question is answered again by the next person, from scratch.",
        "<b>Unverifiable.</b> A figure copied by hand has no link back to its page. Errors travel.",
        "<b>Locked value.</b> Customers cannot query the research they pay for, so its value is capped.",
        "<b>Investment risk.</b> An enterprise system is expensive before anyone has proved customers want it."]) + '</div>' +
      '<div class="stack"><h3 class="ok">Expected outcome at week 10</h3>' + cards("ok", [
        "<b>Minutes, not hours.</b> One question searches the whole permitted library and returns a cited answer.",
        "<b>Every claim has a page.</b> Click a citation and see the quote highlighted on the real page.",
        "<b>No confident errors.</b> Wrong-and-confident measured on an agreed question set. Target zero.",
        "<b>Access that cannot leak.</b> A user only ever sees passages from libraries they are granted.",
        "<b>A go or no-go number.</b> Pilot data that sizes the enterprise build, or shows cheaply why not."]) + '</div></div>',
      note: "Left is from the brief. Right is our proposal of what success means; the client has to agree it, especially the last row. Ask which of the five matters most." },

    // ---------- 2 SOLUTION ----------
    { sec: "SOLUTION", theme: "accent", cls: "center", html:
      '<div class="kicker">Our answer in one line</div><h1 style="font-size:64px;max-width:1100px">The assistant never shows an answer it cannot back up.</h1>' +
      '<p class="big" style="max-width:1000px">Every claim carries a page citation. Plain code, not a model, checks that the cited quote is on that page and that every number in the claim is in the quote. If the library does not support an answer, it says so.</p>',
      note: "Pause here. The differentiator is not AI over PDFs. It is the check that runs after the model and before the user, and that it is deterministic code anyone can audit." },

    { sec: "SOLUTION", html:
      title("What the user sees, start to finish") +
      '<div class="cols c3">' +
      card("", '<div class="lbl">1 · Sign in and pick a library</div><p>Only the libraries this user is granted are listed. A customer sees their own library and nothing else.</p>') +
      card("", '<div class="lbl">2 · Ask in plain language</div><p>Optionally narrow by report type, sector or date. “The April 2024 monitor” in the question becomes a filter.</p>') +
      card("", '<div class="lbl">3 · Watch the answer being built</div><p>Sources found, then each drafted claim with a green “Quote on page N” or a red “Removed” and the reason.</p>') +
      card("", '<div class="lbl">4 · Read the cited answer</div><p>Each kept claim has a citation chip: report and page. Click it and the page opens with the quote highlighted.</p>') +
      card("", '<div class="lbl">5 · Rate it, or escalate</div><p>Thumbs up, or down with a reason. “Create review request” hands it to a person. Nothing happens unless pressed.</p>') +
      card("soft", '<div class="lbl">Or · an honest refusal</div><p>“I could not find this in the selected library”, with the closest passages shown. It does not guess.</p>') + '</div>' +
      card("panel", '<p>A second tab, <b>Investigation steps</b>, shows the search, each model call, each quote check and any retry, in order, each marked “Model call” or “Plain code” with its duration. An auditor can replay how any answer was made.</p>') +
      '<p class="dim" style="font-size:14px">Steps 1 to 5 and the steps tab run today in the demo slice.</p>',
      note: "If a live demo is possible, run it here on the World Bank library: one single-report question, one that should refuse. The demo user picker is not a login; the real build gets SSO." },

    { sec: "SOLUTION", html:
      title("Architecture: how an answer is made") +
      '<div class="flow">' +
      card("", '<div class="lbl u">Ingest</div><div class="t">PDF, page by page</div><p class="dim">Text kept with its page number. Scanned pages flagged for OCR. Quality report per document.</p>') + arr() +
      card("", '<div class="lbl u">Retrieve</div><div class="t">Permitted libraries only</div><p class="dim">Keyword plus meaning search, merged and re-ranked. The access grant is a join in the query.</p>') + arr() +
      card("soft", '<div class="lbl u" style="color:var(--accent)">Draft · model</div><div class="t">Claims with exact quotes</div><p>Reads only the retrieved passages. Returns each claim with the word-for-word quote it relies on.</p>') + arr() +
      card("ink", '<div class="lbl u" style="color:var(--almond)">Gate · plain code</div><div class="t">Quote on page? Numbers match?</div><p style="color:var(--almond)">Fails: retry once with the reasons. Still fails: remove the claim, or refuse.</p>') + arr() +
      card("", '<div class="lbl u">Show · audit</div><div class="t">Cited answer, page viewer</div><p class="dim">Who asked what, which libraries, which sources, every outcome logged.</p>') + '</div>' +
      '<div class="cols c3">' +
      card("panel", '<div class="lbl">Front end</div><p>Web app: chat panel, canvas view, page viewer with highlighted quote, investigation steps, admin upload.</p>') +
      card("panel", '<div class="lbl">Back end</div><p>Python service. One store for passages, vectors, grants and audit, so access filtering happens in the same query.</p>') +
      card("panel", '<div class="lbl">Model</div><p>Behind a thin interface. Provider, region and retention terms are decided with you in week 1.</p>') + '</div>' +
      '<p class="dim" style="font-size:14px">The gate and the loop run today; meaning search and OCR are week 2 to 5 work.</p>',
      note: "Walk left to right. The model only ever sees passages the user may see. The gate is deterministic string checks, so it is auditable and costs no model call. It cannot judge relevance, which is why wrong-and-confident is measured." },

    { sec: "SOLUTION", html:
      title("The grounding gate: three rules, no model") +
      '<div class="cols side"><div class="stack">' +
      card("", '<div class="t">The quote must be on the cited page</div><p class="dim">Exact text match after whitespace normalisation. A paraphrase fails.</p>') +
      card("", '<div class="t">Every number in the claim must be in the quote</div><p class="dim">This is where a confident wrong figure would come from. It is caught before display.</p>') +
      card("", '<div class="t">The claim may only cite a page the model was given</div><p class="dim">Stops the model citing a document it was never shown, including one the user may not see.</p>') +
      card("panel", '<p>Fail: retry once with the reasons. Fail again: the claim is removed. Nothing survives: “Not found in this library”, with the closest passages.</p>') + '</div>' +
      card("ink", '<h3>What the gate does not do</h3><div class="stack" style="margin-top:10px"><p>It proves the quote is on the page. It does not prove the claim <i>means</i> what the quote means, or that it answers the question.</p><p>So the model still has to judge relevance and refuse. Our labels say “Quote on page 14”, never “Verified”.</p><p style="color:var(--almond)">That gap is why wrong-and-confident is measured on a question set, not assumed from the gate.</p></div>') + '</div>' +
      '<p class="dim" style="font-size:14px">Each rule has a test that fails when the rule is removed; that was checked by removing each one.</p>',
      note: "Say the limit before the client finds it. A model-free baseline scored 21 of 22 wrong-and-confident for exactly this reason. The gate removes fabrication; the model and the eval remove irrelevance." },

    { sec: "SOLUTION", html:
      title("Access control: enforced inside the search, not after it") +
      '<div class="cols side"><div class="stack">' + cards("", [
        "<b>Roles map to libraries.</b> A user to library grants table. A customer is granted their library and nothing else.",
        "<b>The grant is a join in the retrieval query.</b> A passage the user may not see is never returned, never reaches the model, and so can never be cited. There is no later filter that could be forgotten.",
        "<b>The page viewer repeats the check.</b> A guessed page id returns nothing for a user without the grant.",
        "<b>Audit log.</b> Who asked what, which libraries were searched, which sources were used, what the outcome was.",
        "<b>Documents are data, not instructions.</b> Text inside a PDF cannot change the assistant’s behaviour. Superseded reports are flagged."]) + '</div>' +
      '<div class="stack">' + card("panel", '<h3>Runs today</h3><p style="margin-top:8px">Grants table, the join in retrieval, the page route check, and the audit log. A test fails if the join is removed.</p>') +
      card("warn", '<h3 class="warn">Not yet</h3><p style="margin-top:8px">Real authentication. The demo has a user picker. The pilot needs your single sign-on, or email login if SSO is not available in time.</p>') + '</div></div>',
      note: "Access was a hard requirement in the brief. Design done and tested; login depends on them. Ask which identity provider they use and whether we get a test tenant in week 1." },

    // ---------- 3 WHAT EXISTS ----------
    { sec: "WHAT EXISTS", theme: "panel", html:
      title("What runs today: a working demo slice") +
      '<p class="dim">Built on five public World Bank Malaysia Economic Monitor reports, about 490 pages. 60 automated tests. Not a prototype on your documents yet.</p>' +
      table("wrap", ["Part", "State", "Note"], [
        ["Ingest, access-controlled retrieval, grounding gate, retry, audit", "{ok}Built, tested", "Core pipeline. No runtime dependencies beyond the standard library."],
        ["Evaluation harness and 22-question set", "{ok}Built", "Baselines scored. Real model run four times, see next slide."],
        ["Web demo: canvas, steps view, feedback, review request", "{ok}Built", "Checked in headless Chrome and jsdom. Camera and drag not exercised."],
        ["Real-model run on the question set", "{ok}Run, four times", "Qwen 3.8 27B. Wrong-and-confident 0 in every run. Refuses about half of what it could answer."],
        ["Cross-report comparison questions", "{danger}Fails", "Retrieval misses one side. Needs a query rewrite per report."],
        ["Embeddings, OCR, production login", "{danger}Not started", "Weeks 2 to 6 of the plan."]]) +
      '<p class="dim" style="font-size:14px">Status as of 24 October 2026</p>',
      note: "Do not oversell. It proves the design works end to end on real reports. It does not prove answer quality and has never seen a client document. Give us five reports and it runs the same day; the quality number takes the question set." },

    { sec: "WHAT EXISTS", html:
      title("Results so far: what is measured, what is not") +
      '<div class="cols side"><div class="stack" style="gap:14px">' +
      '<h3>Retrieval: is the right page in the top 12?</h3>' + table("sm wrap", ["Question type", "Right page found"], [["Single report, 12 questions", "{ok}12 of 12"], ["Two reports, 3 questions", "{danger}0 of 3 get both pages"]]) + '<p class="dim" style="font-size:15px">Right page in the top 12 across the set: 0.867.</p>' +
      '<p class="dim" style="font-size:15px">Reading order and the edition filter made the difference. Nothing was tuned on these questions; 19 anchors were added after checking pages by hand, because the reports repeat forecasts in the summary.</p>' +
      '<h3>Model-free baselines, as a floor</h3>' + table("sm wrap", ["Baseline", "Correct", "Timid", "Wrong and confident"], [["Quote the best sentence", "1 of 15", "0", "{danger}21 of 22"], ["Refuse on weak match", "0 of 15", "9", "{danger}9 of 22"]]) + '</div>' +
      '<div class="stack">' + card("ink", '<div class="lbl u" style="color:var(--almond)">Wrong and confident, real model, four runs</div><div class="num">0 of 60</div><p>Qwen 3.8 27B on the 22 questions, four runs, 15 answerable each. It never stated a false figure as fact. Every miss was a refusal.</p>') +
      table("sm", ["Run", "Correct", "Timid", "Refused right", "Wrong"], [["1", "9 of 15", "6", "7 of 7", "{ok}0"], ["2", "5 of 15", "10", "7 of 7", "{ok}0"], ["3", "7 of 15", "8", "7 of 7", "{ok}0"], ["4", "8 of 15", "7", "7 of 7", "{ok}0"]]) +
      card("warn", '<p><b>Timid is the real failure.</b> About half the answerable questions are refused, and all three cross-report questions every time. Results vary run to run at temperature zero, so quote three runs, never one.</p>') + '</div></div>',
      note: "Lead with the zero, then say what it does not mean: the model refuses a lot, and cross-report questions always. The model measured is Qwen 3.8 27B through Nous Research, not the Claude in the original proposal; say so if asked. The baselines prove a model-free approach cannot work." },

    // ---------- 4 TECHNOLOGY ----------
    { sec: "TECHNOLOGY", html:
      title("Technology: what we propose and why") +
      table("sm wrap", ["Layer", "Pilot choice", "Why", "In the slice today"], [
        ["Back end", "Python, FastAPI", "Strong PDF and evaluation libraries, typed API, easy to test", "{ok}Same"],
        ["Store and search", "PostgreSQL with pgvector and full-text search", "One store for passages, vectors, grants and audit, so the access rule lives in the query", "{warn}SQLite FTS5, keyword only"],
        ["PDF reading", "poppler page extraction, OCR fallback, table extraction", "Keeps page numbers, which citations need; reading-order mode handles two-column pages", "{warn}poppler only, OCR flagged not run"],
        ["Model", "Any Anthropic or OpenAI-compatible model, behind a thin interface", "Provider, region and retention decided with you in week 1. One adapter file to swap", "{ok}Measured on Qwen 3.8 27B. Claude adapter built, not yet run"],
        ["Front end", "React web app", "Chat, page viewer and admin screens need component state and accessibility work", "{warn}One plain HTML page"],
        ["Files", "Private object storage", "Original PDFs, page images, retention rules", "{warn}Local files"],
        ["Login", "Your single sign-on, else email login", "Matches how your customers already sign in", "{danger}Demo user picker"],
        ["Hosting", "Cloud Run and Cloud SQL on GCP, or your cloud", "Managed, scales to zero for a pilot, region selectable", "{danger}Laptop"]]) +
      '<p class="dim" style="font-size:15px">The gate, the answer loop, the trace, the access rule and the question set carry over unchanged when the store and front end are swapped, because they depend on a retrieval function and a model interface, not on SQLite or on the page.</p>',
      note: "The right column is deliberate: the slice used the lightest thing that proves each idea. Migration is weeks 2 to 3 and does not touch the parts that matter. A mandated cloud or provider changes two rows and nothing else." },

    { sec: "TECHNOLOGY", html:
      title("Alternatives considered") +
      table("sm wrap", ["Option", "Strength", "Why not for this pilot", "When it wins"], [
        ["<b>Our build</b>: hybrid search, verified citations, access in the query", "Quote and number check before display; per-page citations; access that cannot leak; measurable", "More engineering than a managed service. Quality depends on the question set we build with you", "{ok}When a wrong figure costs more than the build"],
        ["Managed RAG service (Vertex AI Search, Azure AI Search with OpenAI, Bedrock Knowledge Bases)", "Days to a first answer. Hosted ingestion and vector search. ACL filtering built in", "Citations point at a chunk, not a checked quote on a page. No number check. Harder to audit how an answer was made", "If chunk-level citations are acceptable and speed beats control"],
        ["Off-the-shelf assistant (Copilot, NotebookLM Enterprise)", "Zero build. Staff may already have licences", "No per-customer library access model, no eval harness, no audit of grounding. Not a product you can offer customers", "Internal staff use only"],
        ["Dedicated vector database (Qdrant, Elasticsearch) beside Postgres", "Faster at millions of passages; richer ranking", "Two stores means the access rule is enforced in two places. A pilot library does not need the scale", "Enterprise phase, if volume demands it"],
        ["Self-hosted open-weight model", "Data never leaves your network", "GPU cost and ops for a pilot; lower answer quality means more refusals", "If no API provider’s region or retention terms are acceptable"]]) +
      card("soft", '<p><b>Candid view.</b> If you only need “chat with our PDFs” for staff, a managed service is cheaper and we would say so. The build is justified by two things the brief asks for that managed services do not do: claims checked against the page, and a measured wrong-and-confident rate you can put in front of customers.</p>'),
      note: "Expect “why not just use Copilot or Vertex”. Answer it before it is asked. The model row is swappable: nothing stops us running on their preferred provider." },

    { sec: "TECHNOLOGY", html:
      title("Expected running cost of the pilot") +
      '<div class="cols side"><div class="stack" style="gap:12px">' +
      '<h3>Model cost per question, indicative</h3>' + table("sm wrap", ["Model", "List price per 1M tokens in / out", "One question, with retry"], [["Claude Sonnet 5.5 (proposed)", "USD 2 / 10", "About 1.5 to 3 US cents"], ["Claude Opus 5.5", "USD 4 / 20", "About 3 to 6 US cents"], ["Claude Haiku 5.5", "USD 0.10 / 0.50", "Under 0.2 US cents"]]) +
      '<p class="dim" style="font-size:14px">Assumes 12 passages of about 350 tokens each plus a short answer, roughly 5,000 input and 400 output tokens per call. Prompt caching cuts the input side further. Measured per question during the pilot, not assumed.</p>' +
      '<h3>Platform, per month</h3>' + table("sm wrap", ["Item", "Indicative"], [["Cloud Run service, scales to zero", "USD 20 to 60"], ["Cloud SQL for PostgreSQL, small instance", "USD 40 to 90"], ["Object storage, logging", "Under USD 10 at pilot volume"], ["OCR for scanned pages, one-off", "About USD 1.50 per 1,000 pages"]]) + '</div>' +
      '<div class="stack">' + card("ink", '<div class="lbl u" style="color:var(--almond)">Pilot at 2,000 questions a month</div><div class="num">Under USD 250</div><p>per month for model and platform together, on list prices as of October 2026.</p>') +
      card("warn", '<p><b>The real cost is people.</b> Five developers for ten weeks, plus your research staff’s time to write and grade 60 to 100 questions. That staff time is the one input we cannot substitute.</p>') + '</div></div>' +
      '<p class="dim" style="font-size:14px">Indicative figures on public list prices; to be confirmed against the chosen provider and region.</p>',
      note: "Give the per-question figure, then stop. The model is a rounding error at pilot scale. What costs money is engineering time and their researchers’ time. Do not quote a people cost here; that is a commercial conversation." },

    { sec: "TECHNOLOGY", html:
      title("Limitations and what it takes to maintain") +
      '<div class="cols c2"><div class="stack"><h3 class="danger">Limits, stated plainly</h3>' + cards("", [
        "<b>Charts are not read.</b> The assistant cites a chart’s page and caption and quotes figures stated in the text. It does not read values off a picture.",
        "<b>Numbers written as words are not checked.</b> “four percent” passes the number check; “4 percent” is verified.",
        "<b>Meaning is not checked.</b> A quote can be on the page and still not support the claim. A reviewer can disagree with a passing claim.",
        "<b>Scanned and table-heavy reports are the risk.</b> We have only run on clean, born-digital reports so far. Your layouts may differ.",
        "<b>A small question set is a signal, not proof.</b> The pilot gate needs 60 to 100 questions graded by your staff."]) + '</div>' +
      '<div class="stack"><h3 class="ok">Maintenance after week 10</h3>' + cards("ok", [
        "<b>Adding a report</b> is an admin upload. The ingestion quality report flags pages that need attention. No developer needed.",
        "<b>Changing the model</b> is one adapter file. The evaluation runs on every change, so a regression is visible before users see it.",
        "<b>Growing the question set</b> happens from user feedback: a thumbs-down with a reason becomes a new test question.",
        "<b>Ongoing effort</b> at pilot scale: a part-time owner for uploads and grants, and a developer on call for model or provider changes."]) +
      card("panel", '<p><b>Handover</b> includes the runbook, the test suite and the question set, so your team or ours can carry it on.</p>') + '</div></div>',
      note: "The weakest point is the fourth limit: we have never ingested a client document. Ask for five reports today, including the ugliest scanned one and the most table-heavy one." },

    // ---------- 5 PLAN ----------
    { sec: "PLAN", theme: "panel", html:
      title("The 10-week plan") +
      table("sm wrap", ["Weeks", "Milestone", "Work", "Done when"], [
        ["1", "<b>Discovery and first measurement</b>", "Run the real model on the 22 questions. Pilot library, users and gate thresholds agreed. Provider, region, retention decided. Five sample reports ingested. Question set drafting starts with your staff.", "Wrong-and-confident measured. Client signs off library, gates and provider."],
        ["2 to 3", "<b>Ingest your library</b>", "PostgreSQL with vectors and full-text. Hybrid search. OCR path. Ingestion quality report. Edition and sector filters.", "Right page in the top results for the agreed retrieval questions on your reports."],
        ["4 to 5", "<b>Answer and verify</b>", "Comparison questions rewritten per report. Follow-up rewriting. Table extraction and citation. Citation page viewer. React front end.", "No unverified claim reaches a user. Cross-report questions answered."],
        ["6", "<b>Access and admin</b>", "Single sign-on or email login. Roles and library grants. Admin upload, replace, retire. Audit log export.", "Every access question in the set is refused correctly."],
        ["7", "<b>Evaluate</b>", "Evaluation dashboard on the full question set. Feedback loop into the set. Baseline timing of five questions done by hand.", "Dashboard runs on every change. Baseline recorded."],
        ["8 to 9", "<b>Pilot</b>", "Real users on the pilot library. Track questions, share with verified citations, ratings, time versus baseline, cost per question. Fix what the pilot finds.", "Two weeks of pilot data collected."],
        ["10", "<b>Gate and handover</b>", "Results against the agreed thresholds. Enterprise sizing from measured volume and cost. Runbook, tests and question set handed over.", "Go or no-go decision made on measured results."]]) +
      '<p class="dim" style="font-size:15px">If time is short, we cut from the bottom: charts beyond captions, conversation polish, extra filters. We never cut quote verification or access control.</p>',
      note: "Week 1 is front-loaded with client decisions. If they slip, everything slips. Weeks 8 to 9 depend on pilot users actually using it; ask the client to name them now." },

    { sec: "PLAN", html:
      title("What you will see at each checkpoint") +
      '<div class="cols c4">' +
      card("", '<div class="lbl">End of week 1</div><p>The real model’s score on the 22-question set, and your five sample reports ingested with their quality reports.</p>') +
      card("", '<div class="lbl">End of week 3</div><p>Your pilot library searchable. Retrieval hit rate on your own questions, keyword and meaning search side by side.</p>') +
      card("", '<div class="lbl">End of week 5</div><p>Cited answers on your reports, including cross-report comparisons, in the real front end with the page viewer.</p>') +
      card("", '<div class="lbl">End of week 7</div><p>Login with your identity provider, admin upload, and the evaluation dashboard on the full question set.</p>') + '</div>' +
      '<div class="cols side">' +
      card("ink", '<div class="lbl">End of week 10: the gate review</div><p>Pilot numbers against the thresholds you set in week 1: share of questions answered with verified citations, ratings, time to answer against the hand baseline, cost per question, and wrong-and-confident on the full set.</p>') +
      card("soft", '<div class="lbl">Then one of two outcomes</div><p>Thresholds met: the same measurements size the enterprise build. Not met: the evaluation shows exactly where, and you stop having spent little.</p>') + '</div>',
      note: "Each checkpoint is a thing the client can see, not a status report. Offer a 30-minute review at each one. The week 10 thresholds must be the client’s numbers, agreed in week 1." },

    { sec: "PLAN", html:
      title("Roles and responsibilities") +
      table("sm", ["Who", "Owns", "Covers", "Busiest in"], [
        ["<b>Irfan Ali</b><br>Team lead", "Verification and evaluation", "Grounding gate, question set with your staff, evaluation dashboard, gate review. Single point of contact for the client. Built the demo slice.", "Weeks 1, 7, 10"],
        ["<b>Adam</b>", "Ingestion", "Upload, page-aware reading, OCR fallback, table extraction, ingestion quality report, superseded flags.", "Weeks 1 to 3"],
        ["<b>Fahim</b>", "Retrieval", "PostgreSQL with vectors and full-text, hybrid ranking, filters, comparison and follow-up query rewriting.", "Weeks 2 to 5"],
        ["<b>Shananth</b>", "Access and admin", "Login with your identity provider, roles, library grants, admin screens, audit log, hosting and deployment.", "Weeks 2, 6, 8"],
        ["<b>Irfan</b>", "Interface", "React front end, chat and canvas, citation page viewer, investigation steps, feedback, review requests.", "Weeks 4 to 9"]]) +
      '<div class="cols c3">' +
      card("panel", '<p><b>Everyone knows the whole pipeline.</b> Each owner can explain how an answer is made end to end and run the demo. Ownership is who answers first, not who works alone.</p>') +
      card("panel", '<p><b>Pilot weeks are shared.</b> In weeks 8 to 9 everyone rotates on pilot support and fixes, so no single area blocks the gate.</p>') +
      card("warn", '<p><b>Proposed, not final.</b> The mapping of people to areas is confirmed by the team before this meeting. Areas and the lead do not change.</p>') + '</div>',
      note: "Team: confirm this mapping before the client meeting and remove the “proposed” box. Each person should be ready to answer one question outside their own area." },

    { sec: "PLAN", html:
      title("What we need to ask you before week 1") +
      '<div class="cols c3 qa">' +
      card("", '<h3>Workflow</h3><ul><li>Who answers cross-report questions today, how often, and how long does one take?</li><li>What are the five most common questions customers ask?</li><li>Who reviews an answer before a customer sees it?</li></ul>') +
      card("", '<h3>The library</h3><ul><li>Which library is the pilot, and how many reports and pages does it hold?</li><li>Are there scanned or table-heavy reports? Can we have five of each kind this week?</li><li>How are reports superseded or retired? Is metadata (date, sector, type) recorded anywhere?</li></ul>') +
      card("", '<h3>People and grading</h3><ul><li>Who from the research team will help write and grade 60 to 100 questions, and how much time can they give?</li><li>Who are the pilot users, and are any of them customers?</li><li>What rating, time saving and cost per question would justify an enterprise build?</li></ul>') +
      card("", '<h3>Data and providers</h3><ul><li>Which model providers and hosting regions are acceptable for this content?</li><li>Are there retention or no-training terms we must meet?</li><li>Is any report confidential to specific customers, so library boundaries are contractual?</li></ul>') +
      card("", '<h3>Access and environment</h3><ul><li>Which identity provider do your staff and customers use? Can we get a test tenant?</li><li>Do we host on our cloud or yours? Who provisions accounts and network access?</li><li>Must the pilot sit inside an existing portal, or can it be a standalone site?</li></ul>') +
      card("soft", '<h3>Blocks week 1</h3><ul><li>Five sample reports, this week</li><li>A named research contact for the question set</li><li>A decision on provider and region</li><li>A named client sponsor who can sign off the gates</li></ul>') + '</div>',
      note: "Assign each box to one team member to ask. Write the answers down in the meeting; they feed the assumptions slide. The pink box is the ask to close on." },

    { sec: "PLAN", html:
      title("Assumptions: known, assumed, to confirm") +
      '<div class="cols c3 tight">' +
      '<div class="stack">' + card("ok", '<h3 class="ok">Known from the brief</h3>') + cards("", [
        "Users ask questions across multiple reports and get grounded, cited answers with document name and page.",
        "Reports are PDFs. Ingestion, indexing and retrieval must be efficient.",
        "Access is restricted to authorised users and libraries.",
        "Quality, relevance and source accuracy must be evaluated, and customer value shown before an enterprise build.",
        "Nice-to-haves: history, filters, admin, feedback, tables, roles. Project length is 10 weeks."]) + '</div>' +
      '<div class="stack">' + card("warn", '<h3 class="warn">We are assuming</h3>') + cards("", [
        "Reports are mostly born-digital English PDFs, like the World Bank set we tested on. Scanned pages are a minority.",
        "The pilot library is in the hundreds of reports, not tens of thousands, so Postgres is enough.",
        "An API model provider is acceptable with no-training and regional terms. Self-hosting is not required.",
        "Research staff can give about half a day a week to the question set in weeks 1 to 7.",
        "A standalone pilot site is acceptable; no portal integration in 10 weeks."]) + '</div>' +
      '<div class="stack">' + card("soft", '<h3>Must confirm with you</h3>') + cards("", [
        "Which library, how many reports, and who the pilot users are.",
        "Model provider, hosting region, data retention and no-training terms.",
        "Identity provider and whether customers log in through it.",
        "The week 10 thresholds: time saving, rating and cost per question that justify an enterprise build.",
        "Whether library boundaries are contractual, which makes access a compliance matter, not only a feature."]) + '</div></div>' +
      '<p class="dim" style="font-size:14px">The brief gave no volumes, library size or thresholds; nothing on this slide is a measured client fact.</p>',
      note: "Read the middle column aloud. Every item there changes the plan if wrong. The scanned-pages assumption is the most likely to be wrong and the costliest if it is." },

    { sec: "PLAN", html:
      title("Risks, and how each is handled") +
      table("sm wrap", ["Risk", "How it is handled", "Owner"], [
        ["<b>The model states something the sources do not say</b>", "Quote and number check, one retry, then refusal. Wrong-and-confident tracked on every change; measured in week 1 before anything else.", "Irfan Ali"],
        ["<b>Messy PDFs: scans, columns, charts, tables</b>", "Per-report ingestion quality report. Weak pages flagged to the admin, never silently trusted. Five ugly samples requested now.", "Adam"],
        ["<b>Cross-report questions miss one side</b>", "Known today. Fix is a rewrite into one query per named report, then re-measure without tuning on the test questions.", "Fahim"],
        ["<b>Customers see research they should not</b>", "Access enforced inside the search and on the page route, covered by tests and by access questions in the set.", "Shananth"],
        ["<b>Sensitive research leaves the company</b>", "Provider chosen with you: no training on data, agreed region and retention. Only permitted passages are ever sent.", "Shananth"],
        ["<b>Week 1 decisions slip</b>", "Everything downstream slips with them. We ask for a named sponsor and five sample reports today.", "Irfan Ali"],
        ["<b>Pilot users do not use it</b>", "Named users and seeded questions agreed in week 1. Usage tracked weekly from week 8, not discovered at week 10.", "Irfan"]]),
      note: "The two risks the client controls are the last two rows. Our part of the risk is engineering, theirs is decisions and participation, and the plan fails without both." },

    { sec: "CLOSE", theme: "dark", cls: "between", html:
      '<div class="stack" style="gap:14px"><div class="kicker">To close</div><h1 style="font-size:60px;max-width:1100px">Answers that carry their proof. Access that cannot leak. A pilot that tells you whether to invest.</h1></div>' +
      '<div class="cols c3">' +
      card("ink2", '<div class="lbl">We need from you this week</div><p>Five sample reports, a research contact, a sponsor, and a provider decision.</p>') +
      card("ink2", '<div class="lbl">You get at the end of week 1</div><p>Your own reports running in the demo, and the same four-run measurement on them.</p>') +
      card("accent", '<div class="lbl">At week 10</div><p>A go or no-go decision on your numbers, not ours.</p>') + '</div>' +
      '<p class="names">Adam · Fahim · Shananth · Irfan · Irfan Ali</p>',
      note: "End on the three boxes and stop talking. Then ask for the sponsor’s name and the date for the five sample reports before the meeting ends." }
  ];

  var view = document.getElementById("view"), stage = document.getElementById("stage");
  function pad(n) { return n < 10 ? "0" + n : "" + n; }

  function render() {
    var s = S[state.i];
    stage.className = (s.theme || "") + (state.notes ? " notes" : "");
    view.innerHTML = '<div class="slide ' + (s.cls || "") + '">' + s.html + '</div>';
    document.getElementById("note").textContent = s.note || "";
    document.getElementById("meta").innerHTML = s.sec + ' &nbsp; <b>' + pad(state.i + 1) + ' / ' + S.length + '</b>';
    document.getElementById("hint").textContent = "← → slides | N notes | F fullscreen | Home / End";
    document.getElementById("prog").style.width = ((state.i + 1) / S.length * 100) + "%";
    try { location.hash = String(state.i + 1); } catch (e) {}
  }
  function go(d) { var n = Math.max(0, Math.min(S.length - 1, state.i + d)); if (n !== state.i) { state.i = n; render(); } }

  document.addEventListener("keydown", function (e) {
    var k = e.key;
    if (k === "ArrowRight" || k === "PageDown" || k === " " || k === "Enter") go(1);
    else if (k === "ArrowLeft" || k === "PageUp" || k === "Backspace") go(-1);
    else if (k === "Home") { state.i = 0; render(); }
    else if (k === "End") { state.i = S.length - 1; render(); }
    else if (k === "n" || k === "N") { state.notes = !state.notes; render(); }
    else if (k === "f" || k === "F") { if (!document.fullscreenElement) { document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); } else { document.exitFullscreen(); } }
  });
  stage.addEventListener("click", function (e) { if (e.target.closest("a")) return; go(e.clientX < window.innerWidth / 3 ? -1 : 1); });

  function fit() { stage.style.transform = "scale(" + Math.min(window.innerWidth / 1280, window.innerHeight / 720) + ")"; }
  window.addEventListener("resize", fit);
  fit();

  var h = parseInt((location.hash || "").replace("#", ""), 10);
  if (h >= 1 && h <= S.length) state.i = h - 1;
  render();
})();
</script>
